name: Build ThermalCore IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App Archive
        run: |
          xcodebuild -project ThermalCore.xcodeproj \
            -scheme ThermalCore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ThermalCore.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ThermalCore.xcarchive/Products/Applications/ThermalCore.app Payload/
          zip -qr ThermalCore.ipa Payload
          ls -lh ThermalCore.ipa

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.1.0 --yes || true
          git tag -d v1.1.0 || true
          gh release create v1.1.0 ThermalCore.ipa \
            --title "ThermalCore Pro v1.1.0" \
            --notes "v1.1.0: Apple Native Light Glass Cockpit Overhaul, Multi-Zone Thermal Matrix (P/E Cores, GPU, Battery, Chassis), Zero-Freeze Continuous Monitor Engine, Live Log Storage Footprint Meter & Deletion"
