name: ThermalCore
options:
  bundleIdPrefix: com.corethermal
  deploymentTarget:
    iOS: "17.0"
targets:
  ThermalCore:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Assets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.corethermal.pro
      INFOPLIST_FILE: Sources/Info.plist
      GENERATE_INFOPLIST_FILE: NO
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1"
      ENABLE_BITCODE: NO
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
